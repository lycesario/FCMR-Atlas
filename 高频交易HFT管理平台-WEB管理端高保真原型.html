<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HyperDesk · HFT 运营中台 高保真原型</title>
<style>/* ============================================================
   HyperDesk · HFT 运营中台 · B 端设计系统
   参考：交易所运营管理端框架 · 数据驱动渲染 · 业务闭环
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
html[data-theme="dark"]{
  --bg:#080b12; --bg2:#0b0e16; --panel:#10141d; --panel2:#151a26; --elev:#1a2130;
  --line:#1d2432; --line2:#273045;
  --ink:#e9edf5; --ink2:#9aa6bb; --ink3:#607089;
  --brand:#2f7cf6; --brand2:#7b5cff; --brand-bg:rgba(47,124,246,.13);
  --teal:#00d6a4; --teal-bg:rgba(0,214,164,.10);
  --gold:#f0b90b; --gold-bg:rgba(240,185,11,.10);
  --ok:#0ecb81; --ok-bg:rgba(14,203,129,.10);
  --bad:#f6465d; --bad-bg:rgba(246,70,93,.10);
  --violet:#a78bfa; --violet-bg:rgba(167,139,250,.12);
  --shadow:0 14px 44px rgba(0,0,0,.5);
}
html[data-theme="light"]{
  --bg:#f3f5fa; --bg2:#edf0f6; --panel:#ffffff; --panel2:#f7f9fd; --elev:#ffffff;
  --line:#e3e8f1; --line2:#d3dbe8;
  --ink:#18202f; --ink2:#57627a; --ink3:#93a0b5;
  --brand:#1f6ae0; --brand2:#6a4de0; --brand-bg:rgba(31,106,224,.09);
  --teal:#0a9c7c; --teal-bg:rgba(0,214,164,.10);
  --gold:#a97c08; --gold-bg:rgba(240,185,11,.12);
  --ok:#0aa56a; --ok-bg:rgba(14,203,129,.10);
  --bad:#dd3350; --bad-bg:rgba(246,70,93,.08);
  --violet:#7a5cd6; --violet-bg:rgba(122,92,214,.10);
  --shadow:0 12px 34px rgba(25,35,70,.12);
}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased}
b{font-weight:650}em{font-style:normal}a{color:inherit;text-decoration:none;cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.hash{font-family:var(--mono);font-size:11px;color:var(--brand);word-break:break-all}
.hash:before{content:"0x";opacity:.6}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 布局骨架 ---------- */
.wb{display:flex;height:100vh;overflow:hidden}
.side{width:238px;flex:0 0 238px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30;transition:margin-left .25s}
.wb.folded .side{margin-left:-238px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.content{flex:1;overflow-y:auto;padding:22px 26px 70px;position:relative}
.content.noscroll{overflow:hidden}

/* ---------- 侧栏 ---------- */
.side-brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;flex:0 0 34px;box-shadow:0 6px 16px rgba(47,124,246,.35)}
.side-brand b{font-size:14.5px;letter-spacing:.2px;display:block}
.side-brand em{font-size:10.5px;color:var(--ink3);display:block;margin-top:1px}
.chain-chip{margin:2px 14px 8px;display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:11px;color:var(--ink2)}
.chain-chip i{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 6px var(--teal);animation:pulse 1.8s infinite}
.chain-chip .num{margin-left:auto;color:var(--ink3);font-size:10px}
.role-switch{margin:4px 12px 8px;position:relative}
.role-switch select{width:100%;appearance:none;background:var(--elev);border:1px solid var(--line2);color:var(--ink);border-radius:9px;padding:7px 26px 7px 10px;font-size:12px;font-family:inherit;cursor:pointer}
.role-switch:after{content:"▾";position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--ink3);pointer-events:none;font-size:11px}
.role-switch .rs-lb{font-size:10px;color:var(--ink3);letter-spacing:1.5px;margin-bottom:5px;text-transform:uppercase}
.side-nav{flex:1;overflow-y:auto;padding:4px 10px 14px}
.nav-group{font-size:10px;color:var(--ink3);letter-spacing:1.6px;text-transform:uppercase;padding:14px 8px 5px;display:flex;flex-direction:column;gap:2px}
.nav-group .ng-d{font-size:10px;color:var(--ink3);letter-spacing:.2px;text-transform:none;opacity:.75;font-weight:400}
.nav-item{display:flex;align-items:center;gap:9px;padding:8.5px 10px;border-radius:9px;color:var(--ink2);font-size:13px;cursor:pointer;margin:1px 0;position:relative;transition:background .15s,color .15s}
.nav-item:hover{background:var(--panel2);color:var(--ink)}
.nav-item.on{background:var(--brand-bg);color:var(--ink);font-weight:600}
.nav-item.on:before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.nav-item .ni{width:18px;text-align:center;font-size:14px;flex:0 0 18px}
.nav-item .cnt{margin-left:auto;font-size:10px;background:var(--bad-bg);color:var(--bad);padding:1px 6px;border-radius:8px;font-family:var(--mono)}
.nav-item.locked{opacity:.38;cursor:not-allowed}
.nav-item.locked:hover{background:none;color:var(--ink2)}
.nav-lock-hint{font-size:9.5px;color:var(--ink3);letter-spacing:1.2px;padding:14px 8px 4px;text-transform:uppercase;border-top:1px dashed var(--line);margin-top:10px}
.side-foot{border-top:1px solid var(--line);padding:10px 14px 12px}
.env-chip{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink3);margin-bottom:9px}
.env-chip i{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok)}
.side-user{display:flex;align-items:center;gap:9px}
.uav{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:0 0 30px}
.side-user b{font-size:12.5px;display:block}
.side-user em{font-size:10.5px;color:var(--ink3);display:block}

/* ---------- 顶栏（一级菜单） ---------- */
.topbar{height:54px;flex:0 0 54px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:12px;padding:0 16px;z-index:40}
.topnav{display:flex;align-items:center;gap:1px;overflow-x:auto;flex:1 1 auto;min-width:0;scrollbar-width:none}
.topnav::-webkit-scrollbar{display:none}
.tn-item{position:relative;display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:9px;color:var(--ink2);font-size:12.5px;font-weight:550;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s;flex:0 0 auto}
.tn-item:hover{color:var(--ink);background:var(--panel2)}
.tn-item.on{color:var(--brand);background:var(--brand-bg);font-weight:650}
.tn-item.on:after{content:"";position:absolute;left:13px;right:13px;bottom:-10px;height:2.5px;border-radius:2px;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.tn-item .tn-badge{font-style:normal;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;font-family:var(--mono)}
.top-search{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 12px;color:var(--ink3);font-size:12px;cursor:pointer;flex:0 1 auto;width:250px;min-width:0;overflow:hidden}
.top-search .ph{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-search:hover{border-color:var(--line2)}
.top-search kbd{margin-left:auto;font-family:var(--mono);font-size:10px;background:var(--elev);border:1px solid var(--line2);border-radius:5px;padding:1px 5px;color:var(--ink3)}
.top-acts{display:flex;gap:8px;align-items:center}

/* ---------- 副栏（面包屑） ---------- */
.subbar{height:38px;flex:0 0 38px;display:flex;align-items:center;gap:10px;padding:0 22px;border-bottom:1px solid var(--line);background:var(--bg2);font-size:12px;color:var(--ink2)}
.sub-sp{flex:1}
.crumb{display:flex;align-items:center;gap:7px;font-size:12.5px;min-width:0}
.crumb .cb-g{color:var(--ink3);font-weight:500;white-space:nowrap}
.crumb .cb-sep{color:var(--ink3);font-style:normal;opacity:.6}
.crumb b{font-weight:650;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-right{display:flex;align-items:center;gap:14px;font-size:11px;color:var(--ink3);white-space:nowrap}
.sub-right .cb-env{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:10px;letter-spacing:.5px}

/* ---------- 通用元件 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--elev);color:var(--ink);border-radius:9px;padding:7px 14px;font-size:12.5px;font-family:inherit;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.p{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent;color:#fff}
.btn.p:hover{filter:brightness(1.1);color:#fff}
.btn.danger{background:var(--bad-bg);border-color:rgba(246,70,93,.35);color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
.btn.teal{background:var(--teal-bg);border-color:rgba(0,214,164,.35);color:var(--teal)}
.btn.sm{padding:4px 10px;font-size:11.5px;border-radius:7px}
.btn.lg{padding:9px 20px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:9px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:2px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.tag.b{background:var(--brand-bg);color:var(--brand);border-color:transparent}
.tag.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.tag.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.tag.warn{background:var(--gold-bg);color:var(--gold);border-color:transparent}
.tag.teal{background:var(--teal-bg);color:var(--teal);border-color:transparent}
.tag.v{background:var(--violet-bg);color:var(--violet);border-color:transparent}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--gold)}.dot.idle{background:var(--ink3)}

/* 面板 */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.panel-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:650}
.panel-h .sub{font-size:11px;color:var(--ink3);font-weight:400;margin-left:auto;display:flex;gap:8px;align-items:center}
.panel-b{padding:16px}
.panel-b.tight{padding:0}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 16px;position:relative;overflow:hidden}
.kpi .k-lb{font-size:11px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.kpi .k-v{font-size:24px;font-weight:750;letter-spacing:-.8px;margin-top:5px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.kpi .k-foot{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11px;color:var(--ink3)}
.k-pair{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;color:var(--ink3);border:1px dashed var(--line2);border-radius:5px;padding:1px 6px}

/* 表格 */
table.dt{width:100%;border-collapse:collapse;font-size:12.3px}
.dt th{text-align:left;font-size:10.5px;color:var(--ink3);font-weight:600;letter-spacing:.6px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0;z-index:2;white-space:nowrap}
.dt td{padding:9.5px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.dt tbody tr{transition:background .12s}
.dt tbody tr:hover{background:var(--panel2)}
.dt tbody tr:last-child td{border-bottom:none}
.dt .r{text-align:right}
.dt .c{text-align:center}
.dt .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dt .link{color:var(--brand);cursor:pointer;font-weight:550}
.dt .link:hover{text-decoration:underline}
.tbar{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tbar .sp{flex:1}
.inp{background:var(--panel2);border:1px solid var(--line2);color:var(--ink);border-radius:8px;padding:6.5px 11px;font-size:12.3px;font-family:inherit;outline:none;transition:border .15s}
.inp:focus{border-color:var(--brand)}
.inp::placeholder{color:var(--ink3)}
select.inp{cursor:pointer}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.fld>label{font-size:11.5px;color:var(--ink2);font-weight:550}
.fld .hint{font-size:10.5px;color:var(--ink3)}
.fld .req:after{content:" *";color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.g23{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.g32{display:grid;grid-template-columns:1fr 2fr;gap:12px}

/* 分页 */
.pager{display:flex;align-items:center;gap:6px;padding:11px 14px;font-size:11.5px;color:var(--ink3)}
.pager .pg{min-width:26px;height:26px;border:1px solid var(--line2);border-radius:7px;display:grid;place-items:center;cursor:pointer;background:var(--elev);font-family:var(--mono)}
.pager .pg.on{background:var(--brand-bg);border-color:var(--brand);color:var(--brand);font-weight:650}

/* 状态机 / 流程 */
.stepper{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding:6px 0}
.stepper .stp{display:flex;flex-direction:column;align-items:center;min-width:96px;flex:1;position:relative}
.stepper .stp:before{content:"";position:absolute;top:11px;left:-50%;right:50%;height:2px;background:var(--line2)}
.stepper .stp:first-child:before{display:none}
.stepper .stp.done:before{background:var(--ok)}
.stepper .stp .si{width:23px;height:23px;border-radius:50%;background:var(--elev);border:2px solid var(--line2);display:grid;place-items:center;font-size:10.5px;font-family:var(--mono);position:relative;z-index:1;color:var(--ink3)}
.stepper .stp.done .si{background:var(--ok);border-color:var(--ok);color:#fff}
.stepper .stp.act .si{border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 4px var(--brand-bg)}
.stepper .stp.bad .si{border-color:var(--bad);color:var(--bad)}
.stepper .stp span{font-size:10.5px;color:var(--ink3);margin-top:7px;text-align:center;line-height:1.4}
.stepper .stp.act span{color:var(--ink);font-weight:600}

/* 时间线 */
.tl{position:relative;padding-left:18px}
.tl:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:1.5px;background:var(--line2)}
.tl-item{position:relative;padding:0 0 15px 10px}
.tl-item:before{content:"";position:absolute;left:-17px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--ink3);border:2px solid var(--panel)}
.tl-item.ok:before{background:var(--ok)}
.tl-item.warn:before{background:var(--gold)}
.tl-item.bad:before{background:var(--bad)}
.tl-item.brand:before{background:var(--brand)}
.tl-item .tl-t{font-size:12px;font-weight:600}
.tl-item .tl-d{font-size:11px;color:var(--ink3);margin-top:2px;line-height:1.65}

/* 提示条 */
.note{display:flex;gap:9px;border-radius:10px;padding:10px 13px;font-size:12px;line-height:1.7;margin-bottom:12px;border:1px solid}
.note .ni{font-size:13px;flex:0 0 16px}
.note.info{background:var(--brand-bg);border-color:rgba(47,124,246,.25);color:var(--ink)}
.note.ok{background:var(--ok-bg);border-color:rgba(14,203,129,.25);color:var(--ink)}
.note.warn{background:var(--gold-bg);border-color:rgba(240,185,11,.3);color:var(--ink)}
.note.bad{background:var(--bad-bg);border-color:rgba(246,70,93,.3);color:var(--ink)}
.note b{font-weight:650}

/* 合规标注（16 条致命规则浮点） */
.rule-anno{display:none;border:1.5px dashed var(--gold);background:var(--gold-bg);border-radius:10px;padding:9px 13px;font-size:11.5px;color:var(--ink);line-height:1.7;margin:8px 0}
.rule-anno b{color:var(--gold)}
.wb.rule-on .rule-anno{display:block}
.wb.rule-on [data-rulechip]{outline:1.5px dashed var(--gold);outline-offset:2px;border-radius:6px}

/* 抽屉 */
.drawer-mask,.modal-mask,.pal-mask{position:fixed;inset:0;background:rgba(4,6,12,.6);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .22s;z-index:80}
.drawer-mask.on,.modal-mask.on,.pal-mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:-580px;width:580px;max-width:94vw;height:100vh;background:var(--panel);border-left:1px solid var(--line2);z-index:90;transition:right .26s cubic-bezier(.3,.9,.3,1);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer.on{right:0}
.drawer-h{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line)}
.drawer-h b{font-size:14.5px}
.drawer-h .x{margin-left:auto;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--ink3);border:1px solid var(--line)}
.drawer-h .x:hover{color:var(--ink);border-color:var(--line2)}
.drawer-b{flex:1;overflow-y:auto;padding:18px 20px 30px}
.drawer-f{border-top:1px solid var(--line);padding:13px 20px;display:flex;gap:9px;background:var(--panel)}

/* 模态 */
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);width:470px;max-width:92vw;background:var(--panel);border:1px solid var(--line2);border-radius:16px;z-index:95;opacity:0;pointer-events:none;transition:.2s;box-shadow:var(--shadow)}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal-h{padding:16px 20px 0;font-size:15px;font-weight:700}
.modal-b{padding:14px 20px}
.modal-f{padding:0 20px 18px;display:flex;gap:9px;justify-content:flex-end}

/* ⌘K 面板 */
.palette{position:fixed;left:50%;top:14vh;transform:translateX(-50%) scale(.98);width:560px;max-width:92vw;background:var(--panel);border:1px solid var(--line2);border-radius:16px;z-index:95;opacity:0;pointer-events:none;transition:.18s;box-shadow:var(--shadow);overflow:hidden}
.palette.on{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1)}
.palette .pal-in{width:100%;background:transparent;border:none;outline:none;color:var(--ink);font-size:14.5px;padding:16px 20px;border-bottom:1px solid var(--line);font-family:inherit}
.pal-list{max-height:46vh;overflow-y:auto;padding:8px}
.pal-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:12.8px;color:var(--ink2)}
.pal-item:hover,.pal-item.on{background:var(--brand-bg);color:var(--ink)}
.pal-item .pi{width:20px;text-align:center}
.pal-item .pk{margin-left:auto;font-size:10px;color:var(--ink3);font-family:var(--mono)}
.pal-empty{padding:26px;text-align:center;color:var(--ink3);font-size:12.5px}

/* Toast */
.toasts{position:fixed;top:16px;right:18px;z-index:120;display:flex;flex-direction:column;gap:9px;max-width:380px}
.toast{display:flex;gap:9px;align-items:flex-start;background:var(--elev);border:1px solid var(--line2);border-left:3px solid var(--brand);border-radius:11px;padding:11px 15px;font-size:12.5px;box-shadow:var(--shadow);animation:tin .25s ease-out;line-height:1.6}
.toast.ok{border-left-color:var(--ok)}
.toast.bad{border-left-color:var(--bad)}
.toast.warn{border-left-color:var(--gold)}
@keyframes tin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* 杂项 */
.sec-title{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.sec-title:first-child{margin-top:0}
.sec-title b{font-size:15px;font-weight:700}
.sec-title em{font-size:11.5px;color:var(--ink3)}
.sec-title .sp{flex:1}
.muted{color:var(--ink3)}
.small{font-size:11.5px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.divider{height:1px;background:var(--line);margin:14px 0}
.kv{display:flex;justify-content:space-between;gap:14px;padding:7px 0;font-size:12.3px;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink3);flex:0 0 auto}
.kv .v{text-align:right;word-break:break-all}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;flex:0 0 28px}
.progress{height:6px;border-radius:4px;background:var(--panel2);overflow:hidden}
.progress i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.progress.ok i{background:var(--ok)}
.progress.warn i{background:var(--gold)}
.progress.bad i{background:var(--bad)}
.switch{width:34px;height:19px;border-radius:12px;background:var(--line2);position:relative;cursor:pointer;transition:.18s;flex:0 0 34px}
.switch:after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.18s}
.switch.on{background:var(--ok)}
.switch.on:after{left:17px}
.banner-live{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--ok)}
.banner-live i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}
.rate-lb{font-size:11px;color:var(--ink3);display:flex;justify-content:space-between;margin-bottom:4px}
.risk-meter{height:7px;border-radius:5px;background:linear-gradient(90deg,var(--ok),var(--gold) 55%,var(--bad));position:relative;margin:6px 0 2px}
.risk-meter i{position:absolute;top:-3.5px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--bad);transform:translateX(-50%);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.chart-box{position:relative}
.chart-box canvas{display:block;width:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink3)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.chain-pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:2px 8px;border-radius:20px;border:1px solid var(--line2);background:var(--panel2);font-family:var(--mono);color:var(--ink2)}
.chain-pill i{width:8px;height:8px;border-radius:50%}
.stack-vis{display:flex;flex-direction:column;gap:6px}
.sv-row{display:grid;grid-template-columns:88px 1fr 46px;align-items:center;gap:10px;font-size:11.5px;color:var(--ink2)}
.sv-bar{height:16px;border-radius:5px;background:var(--panel2);overflow:hidden}
.sv-bar i{display:block;height:100%;border-radius:5px}
.heat{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--panel2)}
@media (max-width:1100px){.grid4{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}.g23,.g32{grid-template-columns:1fr}}
@media (max-width:960px){.top-search{min-width:0}.top-search .ph{display:none}.sub-right .cb-env{display:none}}

/* ---------- 安全登录门 ---------- */
.login-mask{position:fixed;inset:0;z-index:200;display:grid;place-items:center;
  background:radial-gradient(1200px 700px at 20% -10%,rgba(47,124,246,.16),transparent 60%),
             radial-gradient(900px 600px at 90% 110%,rgba(123,92,255,.12),transparent 55%),
             var(--bg);
  transition:opacity .45s,visibility .45s}
.login-mask.bye{opacity:0;visibility:hidden}
.login-card{width:410px;max-width:92vw;background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:30px 30px 22px;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:loginIn .5s cubic-bezier(.2,.9,.3,1)}
@keyframes loginIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.login-brand b{font-size:16.5px;display:block;letter-spacing:.2px}
.login-brand em{font-size:11px;color:var(--ink3);display:block;margin-top:2px}
.brand-mark.lg{width:42px;height:42px;flex:0 0 42px;border-radius:12px;font-size:20px}
.login-note{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink2);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;margin-bottom:16px}
.login-hint{margin-top:2px}
.login-foot{margin-top:14px;text-align:center;line-height:1.7}

/* 顶栏图标 & 通知中心 */
.tb-icon{position:relative;width:32px;height:32px;border:1px solid var(--line);background:var(--panel2);color:var(--ink2);border-radius:9px;font-size:14px;cursor:pointer;display:grid;place-items:center;transition:.15s;font-family:inherit}
.tb-icon:hover{color:var(--ink);border-color:var(--brand)}
.tb-icon.on{color:var(--gold);border-color:var(--gold)}
.bell-wrap{position:relative}
.bell-badge{display:none;position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;border-radius:9px;background:var(--bad);color:#fff;font-size:9.5px;font-weight:700;place-items:center;padding:0 4px;font-style:normal}
.bell-panel{position:absolute;right:0;top:42px;width:360px;background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);z-index:60;opacity:0;pointer-events:none;transform:translateY(-6px);transition:.2s}
.bell-panel.on{opacity:1;pointer-events:auto;transform:none}
.bp-h{display:flex;align-items:center;padding:12px 15px;border-bottom:1px solid var(--line);font-weight:650;font-size:13px}
.bp-h .sp{flex:1}
.bp-h a{font-size:11px;color:var(--brand);font-weight:500}
.bp-list{max-height:340px;overflow-y:auto}
.bp-item{display:flex;gap:10px;padding:11px 15px;border-bottom:1px solid var(--line);font-size:12px}
.bp-item:last-child{border-bottom:none}
.bp-item .bi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:14px;flex:0 0 30px}
.bp-item .bt{font-weight:600}
.bp-item .bd{color:var(--ink3);font-size:11px;margin-top:1px;line-height:1.6}
.bp-item .bm{margin-left:auto;font-size:10px;color:var(--ink3);white-space:nowrap}

/* 双栏 grid 页面布局工具 */
.tools-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.mini-tag{font-size:10px;padding:1px 7px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);color:var(--ink3);font-family:var(--mono)}
</style>
</head>

<script>
/* ======================= 数据层 =======================
   范围锚点：《高频交易HFT平台产品功能全景图谱》18 功能域 · 251 功能点
             16 条致命规则（业务规则暗礁）· 8 类指标
   ============================================================ */

/* ---------- 角色（RBAC 最小权限） ---------- */
const ROLES = {
  admin:   {n:'平台管理员',   u:'林奕辰', desc:'全部权限，限额放宽 / Kill Switch 需 2FA + 审批'},
  onboard: {n:'策略接入经理', u:'沈知远', desc:'策略接入 / 席位与 FIX 会话 / 托管申请，无风控处置权'},
  risk:    {n:'实时风控官',   u:'陆则明', desc:'限额调整 / 熔断 / Kill Switch / 复盘归因结论'},
  surveil: {n:'交易所监察',   u:'顾清桐', desc:'异常报价认定 / 合规报送 / 审计调阅，无策略操作权'}
};

/* ---------- 导航（顶栏一级组 → 侧栏二级页） ---------- */
const NAV = [
  {g:'总览', d:'驾驶舱 · 延迟 · 告警', items:[
    {id:'dash',    n:'HFT 总览',        i:'◎', roles:'all'},
    {id:'latency', n:'延迟观测',        i:'⏱', roles:'all'},
    {id:'alarms',  n:'告警中心',        i:'⚡', roles:'all', badge:()=>STATE.alarms.filter(a=>a.st==='new').length},
  ]},
  {g:'策略运营', d:'接入 · 做市 · 套利', items:[
    {id:'intake',  n:'策略接入与审核',  i:'⊕', roles:'all', badge:()=>STATE.intake.filter(k=>k.st==='审核中').length},
    {id:'mm',      n:'做市策略监控',    i:'⇔', roles:'all'},
    {id:'arb',     n:'套利策略监控',    i:'⇄', roles:'all'},
  ]},
  {g:'实时风控', d:'限额 · Kill Switch · 熔断', items:[
    {id:'limits',  n:'实时限额',        i:'▦', roles:'all'},
    {id:'kill',    n:'Kill Switch',     i:'⏻', roles:'all'},
    {id:'breaker', n:'熔断与冷静期',    i:'⌁', roles:'all', badge:()=>STATE.incidents.filter(x=>x.st!=='已闭环').length},
    {id:'quote',   n:'异常报价检测',    i:'⚑', roles:'all', badge:()=>STATE.quoteAnom.filter(q=>q.st==='待处置').length},
  ]},
  {g:'基础设施', d:'机房 · 费率', items:[
    {id:'colo',    n:'席位资源与机房',  i:'▤', roles:'all'},
    {id:'fees',    n:'费用与返佣',      i:'％', roles:'all'},
  ]},
  {g:'合规治理', d:'报送 · 复盘 · 审计', items:[
    {id:'regrep',  n:'合规报送',        i:'⇪', roles:'admin,risk,surveil'},
    {id:'pm',      n:'复盘归因',        i:'◔', roles:'all'},
    {id:'audit',   n:'操作审计',        i:'☰', roles:'all', badge:()=>STATE.audit.length},
  ]},
  {g:'系统', d:'权限', items:[
    {id:'rbac',    n:'角色与权限',      i:'⚙', roles:'admin'},
  ]}
];
const ALL_NAV = NAV.flatMap(g=>g.items.map(i=>i.id));

/* ---------- 致命规则（图谱 16 条业务规则暗礁） ---------- */
const ARULES = [
  {id:'R01', t:'前置风控不可绕过', why:'事后风控在高频场景等于没有风控：一条策略出现误循环后数秒内即可打满全场流动性并建立巨额敞口。', how:'限额页展示报单前校验链路位置（组包前）与校验耗时占比，Kill Switch 为链路内硬开关。', where:'limits'},
  {id:'R02', t:'单笔报单量必须设硬上限', why:'缺少上限时一个手误的数量级就会瞬间建立与账户资本完全不成比例的仓位，测试环境几乎无法覆盖。', how:'限额页展示单笔上限与 Fat Finger 拦截记录，调整单笔上限强制 2FA。', where:'limits'},
  {id:'R03', t:'委托终态不是已成交', why:'把已成交当终态会让账务与持仓在清算被拒时长期错位，成交后清算失败但系统认为已完成。', how:'复盘归因页展示委托状态机：已成交 → 已清算 → 已交收，清算拒绝回流未完成态。', where:'pm'},
  {id:'R04', t:'交易所费率与限速变更必须当日生效', why:'费率或限速改变后策略边际利润可能为负，未同步会导致连续亏损数天且极难归因。', how:'费用与返佣页提供「费率变更当日重算」动作，重算覆盖全部策略盈亏口径。', where:'fees'},
  {id:'R05', t:'时钟不可信则一切归因不可信', why:'时钟漂移不造成功能错误，只让延迟分析与合规留痕整体失真，通常在被监管问询时才暴露。', how:'延迟观测页展示 PTP 偏移监控与主备时钟源健康，偏移超阈值即告警。', where:'latency'},
  {id:'R06', t:'订单簿缺口必须整段作废', why:'忽略序号缺口会得到一个持续存在幽灵档位的看似正确的订单簿，据此报价会持续在错误价位成交。', how:'套利监控页展示行情缺口检测：缺 1 条即整段作废并拉快照，幽灵价差熔断案佐证。', where:'arb'},
  {id:'R07', t:'自成交防范必须与返佣规则联合设计', why:'返佣激励会提高自成交概率，防范配置错误会同时触发合规处罚与资金损失。', how:'费用页展示返佣依赖度与 STP 拦截联动；套利页记录双腿同价位 STP 拦截。', where:'fees'},
  {id:'R08', t:'改单等价于撤单加新单', why:'误以为改单保持队列位置会导致高频改单策略系统性丧失优先级，成交率长期低于模型预期。', how:'异常报价页对疲劳报价（高频改单）设报撤比阈值 20:1 监控并要求解释。', where:'quote'},
  {id:'R09', t:'主备链路切换必须保证不重发', why:'切换窗口继续发单会产生重复委托，轻则超仓重则触发限速封禁，典型于网络频繁抖动时。', how:'机房页展示主备链路（光纤/微波）与切换演练：序号连续、无重复委托校验。', where:'colo'},
  {id:'R10', t:'多场所敞口必须全局计算', why:'各场所独立计算会低估总敞口，两个场所各自接近限额而合计已超风控上限。', how:'限额页展示全局敞口仪表（跨场所合计），单场所仪表旁强制显示全局占比。', where:'limits'},
  {id:'R11', t:'回测必须模拟队列位置', why:'忽略排队会系统性高估被动成交率，上线后策略从高夏普变成低成交低收益。', how:'策略接入审核清单强制勾选「回测含队列位置与部分成交建模」，缺失即驳回。', where:'intake'},
  {id:'R12', t:'生产参数必须与实验记录绑定', why:'参数无法追溯时既无法归因盈亏，也无法在策略失效时快速判断是参数问题还是市场变化。', how:'接入审核与复盘页展示参数版本绑定；GRID-FUT-08 案例即参数缺失的反面教材。', where:'pm'},

const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function toast(msg, type){
  const t = document.createElement('div');
  t.className = 'toast ' + (type||'');
  t.innerHTML = msg;
  $('#toasts').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),320);}, 3600);
}

/* 2FA + 审计确认：敏感操作统一入口 */
function confirm2fa(title, html, okLabel, onOk, ruleId){
  openModal('敏感操作 · '+title, `<div class="note warn"><span class="ni">🔐</span><span>此操作强制 <b>2FA + 审计留痕</b>${ruleId?`，对应致命规则 <b>${ruleId}</b>`:''}。输入动态口令以继续。</span></div>
    ${html||''}
    <div class="fld"><label>动态口令（TOTP）</label><input class="inp mono" id="totpIn" placeholder="6 位数字" maxlength="6"></div>`,
    `<button class="btn" data-act="m-cancel">取消</button><button class="btn p" id="mOkBtn">${okLabel||'确认执行'}</button>`);
  $('#mOkBtn').onclick = ()=>{
    const v = ($('#totpIn')?.value||'').trim();
    if(v.length!==6){ toast('⚠️ 请输入 6 位动态口令（演示可任意 6 位）','warn'); return; }

}

/* ---------- 画布小图 ---------- */
function lineChart(canvas, data, color, fill){
  const dpr = window.devicePixelRatio||1, w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  const max = Math.max(...data)*1.15, min = Math.min(...data)*0.85;
  const X = i=>i/(data.length-1)*(w-4)+2, Y = v=>h-4-((v-min)/(max-min||1))*(h-10);
  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,(color||'#2f7cf6')+'44'); grad.addColorStop(1,(color||'#2f7cf6')+'00');
  ctx.beginPath();
  data.forEach((v,i)=>i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)));
  ctx.strokeStyle = color||'#2f7cf6'; ctx.lineWidth = 1.8; ctx.stroke();
  ctx.lineTo(X(data.length-1),h); ctx.lineTo(X(0),h); ctx.closePath();
  ctx.fillStyle = fill===false?'transparent':grad; ctx.fill();
}
function multiLine(canvas, series){
  const dpr = window.devicePixelRatio||1, w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  const all = series.flatMap(s=>s.data);
  const max = Math.max(...all)*1.04, min = Math.min(...all)*0.96;
  const X = i=>i/(series[0].data.length-1)*(w-4)+2, Y = v=>h-4-((v-min)/(max-min||1))*(h-10);
  series.forEach(s=>{ ctx.beginPath(); s.data.forEach((v,i)=>i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v))); ctx.strokeStyle=s.color; ctx.lineWidth=1.8; ctx.stroke(); });
}

function openStrat(id){

  openDrawer(`
    <div class="drawer-h"><b>策略详情 · ${esc(s.id)}</b><span class="x" data-act="d-close">✕</span></div>
    <div class="drawer-b">
      <div class="kv"><span class="k">名称 / 类型</span><span class="v"><b>${esc(s.n)}</b> · ${esc(s.type)}</span></div>
      <div class="kv"><span class="k">场所</span><span class="v">${esc(s.venue)}</span></div>
      <div class="kv"><span class="k">状态</span><span class="v">${tags(s.st)}</span></div>
      <div class="kv"><span class="k">负责人 / 版本</span><span class="v">${esc(s.owner)} · ${esc(s.ver)}</span></div>
      <div class="kv"><span class="k">席位 / FIX 会话</span><span class="v">${esc(s.seat)} · ${esc(s.fix)}</span></div>
      <div class="divider"></div>
      <div class="sec-title" style="margin-top:6px"><b>实时指标</b></div>
      <div class="kv"><span class="k">今日 PnL</span><span class="v mono" style="color:${s.pnl>=0?'var(--ok)':'var(--bad)'}">${s.pnl===0?'（影子对拍 · 不下单）':fmtPnl(s.pnl)}</span></div>
      <div class="kv"><span class="k">报单频率</span><span class="v mono">${esc(s.ops)}</span></div>
      <div class="kv"><span class="k">成交比 / 延迟 P99</span><span class="v mono">${esc(s.fill)} · ${esc(s.latP99)}</span></div>
      <div class="kv"><span class="k">库存偏移</span><span class="v">${skewBar(s.skew)}<span class="mono small">${s.skew>=0?'+':''}${s.skew}%</span></span></div>
      <div class="kv"><span class="k">VPIN 毒性</span><span class="v"><span class="tag ${s.vpin>=0.6?'bad':s.vpin>=0.4?'warn':'ok'}">${s.vpin.toFixed(2)}</span></span></div>
      <div class="divider"></div>
      <div class="sec-title" style="margin-top:6px"><b>生命周期</b></div>

    </div>`);
}

document.addEventListener('click', e=>{
  const act = e.target.closest('[data-act]');
  if(act){
    const a = act.dataset.act;
    if(a==='do-login'){ $('#loginMask').classList.add('bye'); toast('欢迎回来，<b>陆则明</b> · 会话已建立（15 分钟空闲锁屏）','ok'); pushAudit('登录','console','2FA + FIDO2 通过','ok'); }
    else if(a==='fold'){ $('#wb').classList.toggle('folded'); }
    else if(a==='theme'){ const h=document.documentElement; h.dataset.theme = h.dataset.theme==='dark'?'light':'dark'; }
    else if(a==='rule-toggle'){ $('#wb').classList.toggle('rule-on'); const on=$('#wb').classList.contains('rule-on'); act.classList.toggle('on',on); toast(on?'⚑ 红线标注已开启：页面浮现 16 条致命规则的落点':'红线标注已关闭'); }
    else if(a==='bell'){ const p=$('#bellPanel'); p.classList.toggle('on'); if(p.classList.contains('on')) renderBell(); }
    else if(a==='palette'){ openPalette(); }
    else if(a==='d-close'){ closeDrawer(); }
    else if(a==='m-cancel'){ closeModal(); }
    else if(DEMO[a]) DEMO[a]();
    return;
  }
  const sk = e.target.closest('[data-skill]');
  if(sk){ const id=sk.dataset.skill; const s=STATE.strategies.find(x=>x.id===id);
    if(s) confirm2fa('策略级 Kill · '+id, `<div class="note bad"><span class="ni">⏻</span><span>撤全 <b>${esc(id)}</b> 挂单并停止报单，进程与状态快照保留，不重启。</span></div><div class="kv"><span class="k">当前挂单</span><span class="v mono">${id==='MM-BTC-01'?'1,842':'624'} 张</span></div>`,'2FA 执行 Kill',()=>{
      s.st='已暂停'; pushAudit('策略级 Kill',id,'2FA 执行 · 撤单完成 · 状态快照保留','bad'); closeDrawer(); render(); toast('🛑 '+id+' 已停止（快照保留，可恢复）','bad'); },'R01'); return; }
  const qa = e.target.closest('[data-qa]');
  if(qa){ const q=STATE.quoteAnom.find(x=>x.id===qa.dataset.qa);
    if(q) confirm2fa('异常报价处置 · '+q.id, `<div class="note bad"><span class="ni">⚑</span><span>${esc(q.detail)}</span></div>
      <div class="fld"><label>处置动作</label><select class="inp"><option>强制撤价 + 加宽价差</option><option>限流 50% + 降挂单规模</option><option>暂停双边报价（保留库存对冲）</option><option>转策略级熔断</option></select></div>
      <div class="fld"><label>处置说明（留痕）<span class="req"></span></label><input class="inp" id="qaNote" placeholder="必填：认定依据"></div>`,
      '执行处置', ()=>{ q.st='处置中'; pushAudit('异常报价处置',q.id,q.strat+' · '+($('#qaNote')?.value||''),'bad'); render(); toast('处置已执行：写入审计并同步监察台账','warn'); },'R08'); return; }
  const al = e.target.closest('[data-al]');
  if(al){ const t=STATE.alarms.find(x=>x.id===al.dataset.al); if(t) openDrawer(`<div class="drawer-h"><b>告警详情 · ${esc(t.id)}</b><span class="x" data-act="d-close">✕</span></div><div class="drawer-b"><div class="kv"><span class="k">系统</span><span class="v">${esc(t.sys)}</span></div><div class="kv"><span class="k">级别</span><span class="v">${sevTag(t.sev)}</span></div><div class="kv"><span class="k">内容</span><span class="v">${esc(t.msg)}</span></div><div class="kv"><span class="k">时间</span><span class="v mono">${esc(t.t)}</span></div></div>`); }
  const ack = e.target.closest('[data-al-ack]');
  if(ack){ const t=STATE.alarms.find(x=>x.id===ack.dataset.alAck); if(t){ t.st='acked'; pushAudit('告警确认',t.id,t.sys,'warn'); render(); toast('告警已确认并进入处置','ok'); } }
});

/* ⌘K 键盘 */
document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openPalette(); return; }
  if(!$('#palette').classList.contains('on')) return;
  if(e.key==='ArrowDown'){ palIdx=Math.min(palIdx+1,palItems.length-1); renderPal(); }
  else if(e.key==='ArrowUp'){ palIdx=Math.max(palIdx-1,0); renderPal(); }
  else if(e.key==='Enter'){ palItems[palIdx] && (palItems[palIdx].go(), closePalette()); }
  else if(e.key==='Escape'){ closePalette(); }
});
$('#palInput').addEventListener('input', e=>{ palSearch(e.target.value); palIdx=0; });
$('[data-pmask]').onclick = closePalette;
$('[data-dmask]').onclick = closeDrawer;
$('[data-mmask]').onclick = closeModal;
document.addEventListener('click', e=>{ if(!e.target.closest('.bell-wrap')) $('#bellPanel').classList.remove('on'); });
